<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMO Project Hub</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --text:#1a1d23; --muted:#5d6878; --border:#dce0e6;
  --accent:#3451c7; --accent-soft:#e6ebff; --accent-text:#ffffff;
  --green:#2b8a3e; --green-soft:#e3f5e7; --amber:#b86e00; --amber-soft:#fff1d6; --red:#c92a2a; --red-soft:#ffe5e5;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101318; --surface:#181c22; --surface-2:#222831; --text:#e7eaee; --muted:#9aa4b2; --border:#2d333c;
    --accent:#7d93ff; --accent-soft:#232b48; --accent-text:#0d1020;
    --green:#5fd27a; --green-soft:#1b3123; --amber:#f5b942; --amber-soft:#382d15; --red:#ff7676; --red-soft:#3b1f22;
    --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.muted{color:var(--muted)} .small{font-size:13px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Header */
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.head-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand .ver{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 7px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-size:13px;font-weight:800}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.head-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--border);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.on-share{border-color:var(--green);color:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;font-size:inherit;text-align:left}

main{padding:22px 0 60px}
.view-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head h2{font-size:22px}
.view-head .grow{flex:1;min-width:220px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.g .n{color:var(--green)} .kpi.a .n{color:var(--amber)} .kpi.r .n{color:var(--red)}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select,.field input,.field select,.field textarea,.inline-form input,.inline-form select,textarea.big{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-width:0}
.filters input{flex:1;min-width:180px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent)}
.card h3{font-size:16px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card-top .badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.card-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.card-flags{font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:99px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.ghost{background:none;border:1px solid var(--border)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.txt-red{color:var(--red)!important;font-weight:600}
.txt-amber{color:var(--amber)!important;font-weight:600}
.txt-green{color:var(--green)!important;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius)}

/* Layout helpers */
.two-col{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.box h3{font-size:16px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field-row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field input,.field select,.field textarea{width:100%}
.req{display:flex;gap:14px;align-items:flex-start}
.score{min-width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;background:var(--accent-soft);color:var(--accent)}
.req-body{flex:1;min-width:0}
.req-body h4{margin:0 0 2px;font-size:15px}
.req-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.decision{margin-top:8px;font-size:13px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
.section-title:first-child{margin-top:0}

/* Tables */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr.total td{font-weight:700;background:var(--surface-2)}
table.t .nowrap{white-space:nowrap}

/* Capacity bar */
.bar{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:10px 0 6px;position:relative}
.bar span{display:block;height:100%;border-radius:99px}
.big-num{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}

/* Report */
.report-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
textarea.big{width:100%;min-height:560px;font-family:Consolas,"SF Mono",monospace;font-size:13px;line-height:1.55;resize:vertical}

/* Panel */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20;display:flex;justify-content:flex-end}
.overlay[hidden]{display:none}
.panel{background:var(--bg);width:min(720px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.panel > *{flex-shrink:0}
.panel-head{background:var(--surface);padding:16px 18px;border-bottom:1px solid var(--border)}
.panel-head .row{display:flex;gap:10px;align-items:flex-start}
.panel-head h2{font-size:19px;flex:1}
.health-box{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.hl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.hl-l{font-weight:700;color:var(--muted);min-width:78px}
.reasons{margin:0;padding-left:96px;font-size:13px;color:var(--muted)}
.override-note{font-size:13px;margin-left:86px;padding:6px 10px;border-left:3px solid var(--amber);background:var(--amber-soft);border-radius:0 6px 6px 0}
.gaps{font-size:13px;background:var(--amber-soft);border-radius:8px;padding:8px 12px}
.gaps strong{color:var(--amber)}
.gaps ul{margin:4px 0 0;padding-left:18px}
.ptabs{display:flex;gap:4px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.ptabs button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.ptabs button.on{background:var(--accent-soft);color:var(--accent)}
.panel-body{padding:18px}
.inline-form{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.inline-form input[type=text]{flex:1;min-width:160px}
.row-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.row-item .t{flex:1;min-width:0}
.row-item.done .t{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.update{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.update .d{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input{flex:1}
.record{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.record strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}

/* Activity */
.act-row{display:flex;gap:12px;padding:9px 12px;border-bottom:1px solid var(--border);font-size:14px}
.act-row:last-child{border-bottom:0}
.act-when{color:var(--muted);font-size:12px;min-width:118px;white-space:nowrap;padding-top:2px}
.act-what{flex:1;min-width:0}
.act-what .who{font-weight:600}

/* Dialog */
dialog#dlg{border:1px solid var(--border);border-radius:12px;padding:0;background:var(--surface);color:var(--text);width:min(580px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 12px 48px rgba(0,0,0,.28)}
dialog#dlg::backdrop{background:rgba(10,14,22,.5)}
.dlg-head{padding:16px 18px 4px}
.dlg-head h3{font-size:17px}
.dlg-body{padding:10px 18px 4px}
.dlg-body textarea,.dlg-body input,.dlg-body select{width:100%}
.dlg-err{color:var(--red);font-size:13px;min-height:20px;font-weight:600}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
.check{border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px;background:var(--surface-2)}
.check.ok{background:var(--green-soft)} .check.warn{background:var(--amber-soft)} .check.bad{background:var(--red-soft)}
.check b{display:block;margin-bottom:2px}
.check-line{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:4px 0 10px}
.check-line input{width:auto;margin-top:3px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px 0}

@media (max-width:760px){
  header{position:static}
  .two-col{grid-template-columns:1fr}
  .head-actions{margin-left:0}
  .field-row,.field-row.three{grid-template-columns:1fr}
  .reasons{padding-left:18px}
  .override-note{margin-left:0}
  .act-row{flex-direction:column;gap:2px}
}
</style>
</head>
<body>

<header>
  <div class="wrap head-row">
    <div class="brand"><div class="logo">PMO</div>Project Hub <span class="ver">v2</span></div>
    <nav class="tabs" id="tabs">
      <button data-action="view" data-view="portfolio">Portfolio</button>
      <button data-action="view" data-view="intake">Intake</button>
      <button data-action="view" data-view="deps">Dependencies</button>
      <button data-action="view" data-view="capacity">Capacity &amp; Budget</button>
      <button data-action="view" data-view="report">Status Report</button>
      <button data-action="view" data-view="activity">Activity</button>
    </nav>
    <div class="head-actions">
      <button class="btn sm" data-action="set-user" id="userBtn">Set your name</button>
      <button class="btn sm" data-action="share" id="shareBtn">Team sharing</button>
      <button class="btn sm" data-action="export">Export</button>
      <button class="btn sm" data-action="import">Import</button>
      <button class="btn sm" data-action="reset">Reset sample data</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>
<footer class="wrap" id="footer"></footer>

<div class="overlay" id="overlay" hidden>
  <aside class="panel" id="panel" role="dialog" aria-modal="true">
    <div class="panel-head" id="panelHead"></div>
    <div class="ptabs" id="panelTabs"></div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
/* ============ Setup & helpers ============ */
const STORE_KEY = 'pmo-hub-v2';
const OLD_STORE_KEY = 'pmo-hub-v1';
const USER_KEY = 'pmo-hub-user';
const PHASES = ['Initiate','Plan','Execute','Close','Complete'];
// RAID log: Risks, Actions, Issues, Decisions.
const LOG_TYPES = ['Risk','Issue','Action','Decision'];
const LOG_HELP = {
  'Risk':'might happen',
  'Issue':'happening now',
  'Action':'agreed to-do',
  'Decision':'agreed and logged'
};
const CLOSED_ON_ADD = ['Decision'];
const SEVERITIES = ['High','Medium','Low'];
const HEALTH_LABEL = {green:'On track', amber:'At risk', red:'Off track'};
const HEALTH_RANK = {red:0, amber:1, green:2};
const DEFAULT_SETTINGS = {capacityFTE:12, maxPerOwner:2, staleDays:14, overrideReviewDays:14};

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
function toISO(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
const todayISO = () => toISO(new Date());
function addDays(n){ const d = new Date(); d.setDate(d.getDate() + n); return toISO(d); }
function daysUntil(iso){
  if(!iso) return null;
  return Math.round((new Date(iso+'T00:00:00') - new Date(todayISO()+'T00:00:00')) / 86400000);
}
function fmtDate(iso){
  if(!iso) return '—';
  return new Date(iso+'T00:00:00').toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function fmtStamp(ts){
  return new Date(ts).toLocaleString(undefined, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}
function weekEnding(){ const d = new Date(); d.setDate(d.getDate() + ((5 - d.getDay() + 7) % 7)); return toISO(d); }
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const money = n => '$' + Math.round(num(n)).toLocaleString('en-US');
const moneyShort = n => { n = num(n); return n >= 1e6 ? '$' + (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M' : n >= 1e3 ? '$' + Math.round(n/1e3) + 'k' : '$' + Math.round(n); };
const fte = n => (Math.round(num(n)*10)/10).toString();
const plural = (n, word, pl) => `${n} ${n === 1 ? word : (pl || word + 's')}`;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
function getPath(o, path){ return path.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, path, v){ const ks = path.split('.'); const last = ks.pop(); const tgt = ks.reduce((a, k) => (a[k] ??= {}), o); tgt[last] = v; }
function currentUser(){ try{ return localStorage.getItem(USER_KEY) || ''; }catch(e){ return ''; } }

/* ============ Sample data (fictional company: Northwind Distribution) ============ */
function blankProject(o){
  return Object.assign({id:uid(), name:'New project', owner:'', sponsor:'', phase:'Initiate', startDate:todayISO(), dueDate:addDays(90), percent:0,
    priority:null, summary:'', fte:0, budget:{approved:0, actual:0, forecast:0},
    healthOverride:'', overrideReason:'', overrideBy:'', overrideDate:'',
    deps:[], approval:null, tasks:[], raid:[], updates:[]}, o);
}
function sampleData(){
  const P = blankProject;
  const T = (title, owner, due, done=false) => ({id:uid(), title, owner, due:addDays(due), done});
  const R = (type, title, owner, severity, status, d) => ({id:uid(), type, title, owner, severity, status, date:addDays(d)});
  const U = (d, text, by='') => ({id:uid(), date:addDays(d), text, by});

  const wms = P({name:'Warehouse Management System Upgrade', owner:'Dana Ruiz', sponsor:'VP Operations', phase:'Execute',
    startDate:addDays(-60), dueDate:addDays(45), percent:45, priority:88, fte:4,
    budget:{approved:450000, actual:240000, forecast:470000},
    summary:'Replace legacy WMS at the Memphis DC with a cloud WMS; includes data migration, scanner rollout and staff training.',
    approval:{by:'Steering Committee', date:addDays(-62), reason:'Legacy WMS vendor ends support next year and Memphis DC throughput is capped by the current system.', fte:4, committedBefore:3.5, capacity:12, overCapacity:false},
    tasks:[T('Vendor kickoff and environment setup','Dana Ruiz',-50,true), T('Finalize data migration mapping','Kevin Osei',-3), T('UAT script sign-off','Dana Ruiz',7), T('Cutover plan draft','Kevin Osei',20)],
    raid:[R('Risk','Key super-user on leave during UAT window','Dana Ruiz','High','Open',-12), R('Issue','Scanner firmware incompatible with new WMS','IT Ops','Medium','Open',-6),
          R('Decision','Go-live moved to January freeze window','Steering Committee','Medium','Closed',-9), R('Action','Book training rooms for 40 associates','Dana Ruiz','Low','Open',-2),
          R('Risk','Vendor provides on-site hypercare for two weeks after go-live','Dana Ruiz','High','Open',-40)],
    updates:[U(-7,'Migration mapping 80% complete. Scanner firmware issue escalated to vendor; workaround under test.','Dana Ruiz')]});

  const fin = P({name:'Finance Month-End Close Automation', owner:'Marcus Lee', sponsor:'CFO', phase:'Execute',
    startDate:addDays(-95), dueDate:addDays(-4), percent:85, priority:76, fte:2,
    budget:{approved:120000, actual:118000, forecast:140000},
    approval:{by:'CFO', date:addDays(-97), reason:'Close takes 8 days; the board wants results by day 5.', fte:2, committedBefore:4.5, capacity:12, overCapacity:false},
    healthOverride:'amber', overrideBy:'Marcus Lee', overrideDate:addDays(-3),
    overrideReason:'Mapping fix is in testing and the CFO has agreed a new target date; impact on the close is contained.',
    summary:'Automate journal entries and reconciliations to cut month-end close from 8 days to 5.',
    tasks:[T('Automate accrual journal entries','Marcus Lee',-30,true), T('Bank reconciliation rules','Sara Kim',-8), T('Close calendar sign-off','Marcus Lee',5)],
    raid:[R('Issue','GL account mapping errors found in last close','Sara Kim','High','Open',-5), R('Decision','Keep manual review for intercompany entries','CFO','Low','Closed',-20),
          R('Action','Run a parallel close before cutting over automated entries','Marcus Lee','Medium','Closed',-5)],
    updates:[U(-6,'Mapping errors delayed go-live past target date. Fix in progress; new target pending CFO review.','Marcus Lee')]});

  const onb = P({name:'Client Onboarding Playbook', owner:'Priya Shah', sponsor:'Director, Client Services', phase:'Plan',
    startDate:addDays(-20), dueDate:addDays(60), percent:20, priority:71, fte:1.5,

/* ============ State ============ */
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(OLD_STORE_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && Array.isArray(s.projects)) return normalize(s); }
  }catch(e){}
  return sampleData();
}
// Brings older (v1) data up to v2 shape without losing anything.
function normalize(s){
  s.version = 2;
  s.settings = Object.assign({...DEFAULT_SETTINGS}, s.settings || {});
  s.intake = Array.isArray(s.intake) ? s.intake : [];
  s.audit = Array.isArray(s.audit) ? s.audit : [];
  s.meta = s.meta || {savedAt:'', savedBy:''};
  s.projects = s.projects.map(p => {
    const q = blankProject(p);
    q.tasks ||= []; q.raid ||= []; q.updates ||= []; q.deps ||= [];
    q.percent = num(q.percent); q.fte = num(q.fte);
    q.budget = Object.assign({approved:0, actual:0, forecast:0}, q.budget || {});
    q.healthOverride ||= ''; q.overrideReason ||= ''; q.overrideBy ||= ''; q.overrideDate ||= '';
    return q;
  });
  s.intake.forEach(r => { r.estFte = num(r.estFte); r.estCost = num(r.estCost); });
  const TYPE_MAP = {Gap:'Risk', Assumption:'Risk', Dependency:'Risk', 'Lesson learned':'Action'};
  s.projects.forEach(p => p.raid.forEach(r => { if(TYPE_MAP[r.type]) r.type = TYPE_MAP[r.type]; }));
  return s;
}

const FIELD_LABELS = {name:'Project name', owner:'Project owner', sponsor:'Executive sponsor', phase:'Phase', startDate:'Start date', dueDate:'Due date',
  percent:'Percent complete', summary:'Summary', fte:'Team size (FTE)', 'budget.approved':'Approved budget', 'budget.actual':'Actual spend', 'budget.forecast':'Forecast at completion'};
function fmtVal(field, v){
  if(v === '' || v == null) return '(blank)';
  if(field.endsWith('Date')) return fmtDate(v);
  if(field.startsWith('budget.')) return money(v);
  if(field === 'percent') return v + '%';
  if(field === 'fte') return fte(v) + ' FTE';
  const s = String(v); return s.length > 80 ? `"${s.slice(0,77)}…"` : `"${s}"`;
}

/* ============ PMO logic ============ */
const isComplete = p => p.phase === 'Complete' || p.percent >= 100;
const activeProjects = () => state.projects.filter(p => !isComplete(p));
const S = () => state.settings;

function forecastOf(p){
  const b = p.budget || {};
  if(num(b.forecast) > 0) return num(b.forecast);
  return Math.max(num(b.approved), num(b.actual));
}
function budgetInfo(p){
  const b = p.budget || {}; const approved = num(b.approved), actual = num(b.actual), forecast = forecastOf(p);
  const variancePct = approved > 0 ? Math.round((forecast - approved) / approved * 100) : null;
  const burnPct = approved > 0 ? Math.round(actual / approved * 100) : null;
  return {approved, actual, forecast, variance: forecast - approved, variancePct, burnPct};
}

// Health from the project's own data (no dependency rules). Used for upstream checks to avoid loops.
function baseHealth(p){
  if(isComplete(p)) return {level:'green', reasons:['Project complete']};
  const reasons = []; let level = 'green';
  const bump = l => { if(HEALTH_RANK[l] < HEALTH_RANK[level]) level = l; };
  const d = daysUntil(p.dueDate);
  const open = (type, sev) => p.raid.filter(r => r.type === type && r.status === 'Open' && (!sev || r.severity === sev)).length;
  const openHighIssues = open('Issue','High'), openIssues = open('Issue');
  const overdue = p.tasks.filter(t => !t.done && t.due && daysUntil(t.due) < 0).length;

  if(d !== null && d < 0){ bump('red'); reasons.push(`Past due date by ${plural(-d,'day')}`); }
  if(openHighIssues){ bump('red'); reasons.push(`${plural(openHighIssues,'open high-severity issue')}`); }
  else if(openIssues){ bump('amber'); reasons.push(`${plural(openIssues,'open issue')}`); }
  [['Risk','high risk']].forEach(([t, w]) => {
    const n = open(t,'High'); if(n){ bump('amber'); reasons.push(`${plural(n, 'open ' + w)}`); }
  });
  if(overdue){ bump('amber'); reasons.push(`${plural(overdue,'overdue task')}`); }
  if(p.startDate && p.dueDate && d !== null && d >= 0){
    const total = daysUntil(p.dueDate) - daysUntil(p.startDate);
    const elapsed = -daysUntil(p.startDate);
    if(total > 0 && elapsed > 0){
      const expected = Math.min(100, Math.round(elapsed / total * 100));
      if(p.percent < expected - 20){ bump('amber'); reasons.push(`Behind schedule: ${p.percent}% done vs ~${expected}% of time used`); }
    }
  }
  const b = budgetInfo(p);
  if(b.variancePct !== null){
    if(b.variancePct > 20){ bump('red'); reasons.push(`Forecast ${b.variancePct}% over approved budget`); }
    else if(b.variancePct > 10){ bump('amber'); reasons.push(`Forecast ${b.variancePct}% over approved budget`); }
    if(b.actual > 0 && b.burnPct > 30 && b.burnPct > p.percent + 25){ bump('amber'); reasons.push(`Spent ${b.burnPct}% of budget at ${p.percent}% complete`); }
  }
  return {level, reasons};
}

// Status of one cross-project dependency: p waits on dep.on
function depStatus(p, dep){
  const u = getProject(dep.on);
  const need = dep.neededBy || p.dueDate;
  if(!u) return {key:'gone', level:'', label:'Removed', text:'That project was deleted'};
  if(isComplete(u)) return {key:'done', level:'green', label:'Delivered', text:'Delivered'};
  if(need && daysUntil(need) < 0) return {key:'late', level:'red', label:'Late', text:`not delivered; was needed by ${fmtDate(need)}`};
  const ub = baseHealth(u);
  if(ub.level === 'red') return {key:'risk', level:'amber', label:'At risk', text:`it is off track (${ub.reasons[0]})`};
  if(need && u.dueDate && u.dueDate > need) return {key:'risk', level:'amber', label:'At risk', text:`due ${fmtDate(u.dueDate)}, after the needed-by date ${fmtDate(need)}`};
  if(ub.level === 'amber') return {key:'watch', level:'', label:'Watch', text:'upstream project is at risk'};
  return {key:'ok', level:'green', label:'On track', text:'on track'};
}

// Calculated health = own data + cross-project dependencies. Explains *why*.
function healthInfo(p){
  const base = baseHealth(p);
  if(isComplete(p)) return base;
  let level = base.level; const reasons = [...base.reasons];
  p.deps.forEach(d => {
    const st = depStatus(p, d), u = getProject(d.on);
    if(st.key === 'late'){ level = 'red'; reasons.push(`Waiting on "${u.name}": ${st.text}`); }
    else if(st.key === 'risk'){ if(level === 'green') level = 'amber'; reasons.push(`Waiting on "${u.name}": ${st.text}`); }
  });
  if(!reasons.length) reasons.push('No flags');
  return {level, reasons};
}
const effHealth = p => p.healthOverride || healthInfo(p).level;

function lastUpdateDate(p){
  const ds = p.updates.map(u => u.date).filter(Boolean).sort();
  return ds.length ? ds[ds.length - 1] : '';
}
// Missing or stale data. Separate from health so a "green" with no data can't hide.
function dataGaps(p){
  if(isComplete(p)) return [];
  const g = [];
  if(!String(p.owner || '').trim()) g.push('No project owner');
  if(!p.tasks.length) g.push('No plan (no tasks or milestones)');
  if(!p.dueDate) g.push('No due date');
  const last = lastUpdateDate(p);
  const since = last ? -daysUntil(last) : (p.startDate ? -daysUntil(p.startDate) : null);
  if(since !== null && since > S().staleDays) g.push(last ? `No update in ${since} days` : `No status update since start (${since} days)`);
  if(p.healthOverride){
    if(!String(p.overrideReason || '').trim()) g.push('Health override has no reason recorded');
    else if(p.overrideDate && -daysUntil(p.overrideDate) > S().overrideReviewDays) g.push(`Health override is ${-daysUntil(p.overrideDate)} days old; review it`);
  }
  return g;
}

function intakeScore(r){
  // Value 30%, urgency 20%, strategic alignment 30%, low effort 20% → 0-100
  const raw = r.value*0.3 + r.urgency*0.2 + r.alignment*0.3 + (6 - r.effort)*0.2;
  return Math.round((raw - 1) / 4 * 100);
}

function committedFTE(){ return activeProjects().reduce((n, p) => n + num(p.fte), 0); }
const sameOwner = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
function capacityCheck(addFte, owner){
  const committed = committedFTE(), cap = num(S().capacityFTE), after = committed + num(addFte);
  const ownerCount = owner && owner.trim() ? activeProjects().filter(p => sameOwner(p.owner, owner)).length : 0;
  return {committed, cap, after, over: cap > 0 && after > cap, ownerCount, ownerOver: !!(owner && owner.trim()) && ownerCount + 1 > num(S().maxPerOwner)};
}

function healthPill(level, extra = ''){
  return `<span class="pill ${level}"><span class="dot"></span>${HEALTH_LABEL[level]}${extra}</span>`;
}
function healthBadge(p){
  if(isComplete(p)) return `<span class="pill blue">Complete</span>`;
  if(!p.healthOverride) return healthPill(healthInfo(p).level);
  const calc = healthInfo(p).level;
  return `${healthPill(p.healthOverride, ' · manual')}<span class="pill ghost" title="Calculated health">Calc: ${HEALTH_LABEL[calc]}</span>`;
}
function dueLabel(p){
  if(isComplete(p)) return 'Done';
  const d = daysUntil(p.dueDate);
  if(d === null) return 'No due date';
  if(d < 0) return `${-d}d overdue`;
  if(d === 0) return 'Due today';
  return `Due ${fmtDate(p.dueDate)} (${d}d)`;
}

  const risks = p.raid.filter(r => r.type==='Risk' && r.status==='Open').length;

  else if(p.deps.length && !isComplete(p)) extra.push(`<span>⛓ Waits on ${plural(p.deps.length,'project')}</span>`);
  if(!isComplete(p) && b.variancePct !== null && b.variancePct > 10) extra.push(`<span class="${b.variancePct>20?'txt-red':'txt-amber'}">Budget forecast +${b.variancePct}%</span>`);
  return `<article class="card" tabindex="0" role="button" data-action="open" data-id="${p.id}">

function allDepLinks(){
  const links = [];
  state.projects.forEach(p => p.deps.forEach(d => links.push({p, d, u:getProject(d.on), st:depStatus(p, d)})));
  const order = {late:0, risk:1, watch:2, ok:3, gone:4, done:5};
  return links.sort((a,b) => (isComplete(a.p) - isComplete(b.p)) || order[a.st.key] - order[b.st.key]);
}
function renderDeps(){
  const links = allDepLinks().filter(l => !isComplete(l.p));

  const owners = {};
  active.forEach(p => { const k = String(p.owner || '').trim() || '—'; (owners[k] ||= {name:k, projects:[], fte:0}); owners[k].projects.push(p); owners[k].fte += num(p.fte); });
  const ownerRows = Object.values(owners).sort((a,b) => (a.name==='—') - (b.name==='—') || b.projects.length - a.projects.length);

  const tv = T.a ? Math.round((T.f - T.a) / T.a * 100) : 0;

          <div class="small ${pct>100?'txt-red':pct>=90?'txt-amber':'muted'}">${pct}% committed${pct>100 ? ` · over by ${fte(committed-cap)} FTE` : ` · ${fte(Math.max(0,cap-committed))} FTE available`}</div>
          ${noFte.length ? `<div class="small txt-amber" style="margin-top:8px">${plural(noFte.length,'active project')} ha${noFte.length===1?'s':'ve'} no team size, so capacity may be understated: ${esc(noFte.map(p=>p.name).join(', '))}</div>` : ''}
        </div>
        <div class="box">
          <h3>Settings</h3>
          <div class="field"><label for="set_capacityFTE">Team capacity (FTE available for projects)</label><input id="set_capacityFTE" data-setting="capacityFTE" type="number" min="0" step="0.5" value="${num(S().capacityFTE)}"></div>
          <div class="field"><label for="set_maxPerOwner">Max active projects per owner</label><input id="set_maxPerOwner" data-setting="maxPerOwner" type="number" min="1" step="1" value="${num(S().maxPerOwner)}"></div>
          <div class="field"><label for="set_staleDays">Flag "no recent update" after (days)</label><input id="set_staleDays" data-setting="staleDays" type="number" min="1" step="1" value="${num(S().staleDays)}"></div>
          <div class="field"><label for="set_overrideReviewDays">Ask to review a health override after (days)</label><input id="set_overrideReviewDays" data-setting="overrideReviewDays" type="number" min="1" step="1" value="${num(S().overrideReviewDays)}"></div>
        </div>
      </div>
      <div class="stack">
        <div>
          <div class="section-title">Load by owner</div>
          <div class="table-wrap"><table class="t">
            <thead><tr><th>Owner</th><th class="num">Active projects</th><th class="num">FTE</th><th>Projects</th></tr></thead>
            <tbody>${ownerRows.length ? ownerRows.map(o => {
              const over = o.name !== '—' && o.projects.length > num(S().maxPerOwner);
              return `<tr><td class="nowrap">${o.name==='—' ? '<span class="txt-amber">No owner</span>' : esc(o.name)}</td>
                <td class="num"><span class="${over?'txt-red':''}">${o.projects.length}</span>${over ? ` <span class="pill red">over limit of ${num(S().maxPerOwner)}</span>` : ''}</td>
                <td class="num">${fte(o.fte)}</td>
                <td class="small">${o.projects.map(p => `<button class="linkish" data-action="open" data-id="${p.id}">${esc(p.name)}</button>`).join('<br>')}</td></tr>`;
            }).join('') : `<tr><td colspan="4" class="muted">No active projects.</td></tr>`}</tbody></table></div>
        </div>

          <div class="table-wrap"><table class="t">

            <tbody>${budgetRows.length ? budgetRows.map(p => { const b = budgetInfo(p); return `<tr>
              <td><button class="linkish" data-action="open" data-id="${p.id}">${esc(p.name)}</button>${isComplete(p) ? ' <span class="pill blue">Complete</span>' : ''}</td>
              <td class="num">${money(b.approved)}</td><td class="num">${money(b.actual)}</td><td class="num">${money(b.forecast)}</td>
              <td class="num">${varCell(b)}</td>
              <td class="num">${b.burnPct === null ? '—' : `<span class="${b.burnPct > p.percent + 25 && b.burnPct > 30 && !isComplete(p) ? 'txt-amber' : ''}">${b.burnPct}% / ${p.percent}%</span>`}</td></tr>`; }).join('')

function buildReport(scope){
  const list = scope === 'all' ? activeProjects() : state.projects.filter(p => p.id === scope);
  list.sort((a,b) => HEALTH_RANK[effHealth(a)] - HEALTH_RANK[effHealth(b)]);
  const L = [];
  L.push('# Weekly Status Report');
  L.push(`Week ending ${fmtDate(weekEnding())}${currentUser() ? ` · Prepared by ${currentUser()}` : ''}`);
  L.push('');
  if(scope === 'all'){
    const c = l => list.filter(p => effHealth(p) === l).length;
    L.push(`**Portfolio summary:** ${list.length} active projects: ${c('green')} on track, ${c('amber')} at risk, ${c('red')} off track.`);
    const committed = committedFTE(), cap = num(S().capacityFTE);
    L.push(`**Capacity:** ${fte(committed)} of ${fte(cap)} FTE committed (${cap ? Math.round(committed/cap*100) : 0}%).`);
    const B = list.reduce((t,p) => { const b = budgetInfo(p); t.a += b.approved; t.s += b.actual; t.f += b.forecast; return t; }, {a:0,s:0,f:0});
    if(B.a) L.push(`**Budget:** ${money(B.a)} approved · ${money(B.s)} spent · ${money(B.f)} forecast (${B.f>=B.a?'+':''}${Math.round((B.f-B.a)/B.a*100)}%).`);
    const needs = list.filter(p => effHealth(p) !== 'green');
    if(needs.length) L.push(`**Needs attention:** ${needs.map(p => p.name).join('; ')}.`);
    const overrides = list.filter(p => p.healthOverride && p.healthOverride !== healthInfo(p).level);
    if(overrides.length) L.push(`**Manual health overrides:** ${overrides.map(p => `${p.name} (reported ${HEALTH_LABEL[p.healthOverride]}, calculated ${HEALTH_LABEL[healthInfo(p).level]})`).join('; ')}.`);
    const deps = allDepLinks().filter(l => !isComplete(l.p) && (l.st.key === 'risk' || l.st.key === 'late'));
    if(deps.length){
      L.push('**Cross-project dependencies at risk:**');
      deps.forEach(l => L.push(`- ${l.p.name} waits on ${l.u.name}: ${l.st.text}`));
    }
    const gaps = list.map(p => [p, dataGaps(p)]).filter(([,g]) => g.length);
    if(gaps.length){
      L.push('**Data gaps (status may be unreliable):**');
      gaps.forEach(([p,g]) => L.push(`- ${p.name}: ${g.join('; ')}`));
    }
    L.push('');
  }
  list.forEach(p => {
    const h = effHealth(p), info = healthInfo(p);
    L.push(`## ${p.name} — ${isComplete(p) ? 'COMPLETE' : HEALTH_LABEL[h].toUpperCase()}`);
    L.push(`Owner: ${p.owner || 'UNASSIGNED'} | Sponsor: ${p.sponsor || '—'} | Phase: ${p.phase} | ${p.percent}% complete | ${dueLabel(p)}`);
    if(!isComplete(p)){
      if(p.healthOverride){
        L.push(`**Reported health:** ${HEALTH_LABEL[p.healthOverride]} (manual override by ${p.overrideBy || 'unknown'}${p.overrideDate ? ` on ${fmtDate(p.overrideDate)}` : ''}: ${p.overrideReason || 'no reason recorded'})`);
        L.push(`**Calculated health:** ${HEALTH_LABEL[info.level]}. ${info.reasons.join('; ')}.`);
      } else {
        L.push(`**Health:** ${HEALTH_LABEL[info.level]}. ${info.reasons.join('; ')}.`);
      }
    }
    const b = budgetInfo(p);
    if(b.approved) L.push(`**Budget:** ${money(b.approved)} approved · ${money(b.actual)} spent · ${money(b.forecast)} forecast${b.variancePct ? ` (${b.variancePct>0?'+':''}${b.variancePct}%)` : ''}`);
    const latest = [...p.updates].sort((a,b) => b.date.localeCompare(a.date))[0];
    L.push(`**Latest update:** ${latest ? `${latest.text} (${fmtDate(latest.date)}${latest.by ? ', ' + latest.by : ''})` : 'No update recorded.'}`);
    const gaps = dataGaps(p);
    if(gaps.length) L.push(`**Data gaps:** ${gaps.join('; ')}.`);
    if(p.deps.length && !isComplete(p)){
      L.push('**Waiting on:**');
      p.deps.forEach(d => { const u = getProject(d.on), st = depStatus(p, d); L.push(`- ${u ? u.name : 'Deleted project'} (needed by ${fmtDate(d.neededBy || p.dueDate)}): ${st.label}${st.key==='ok'||st.key==='done' ? '' : ', ' + st.text}`); });
    }
    const upcoming = p.tasks.filter(t => !t.done && t.due && daysUntil(t.due) <= 14).sort((a,b) => a.due.localeCompare(b.due));
    if(upcoming.length){
      L.push('**Next two weeks:**');
      upcoming.forEach(t => L.push(`- ${t.title} — ${t.owner || 'unassigned'}, ${daysUntil(t.due) < 0 ? `OVERDUE (was due ${fmtDate(t.due)})` : `due ${fmtDate(t.due)}`}`));
    }
    const open = p.raid.filter(r => r.status==='Open' && (['Risk','Issue'].includes(r.type)))
      .sort((a,b) => SEVERITIES.indexOf(a.severity) - SEVERITIES.indexOf(b.severity));
    if(open.length){
      L.push('**Open items to watch:**');
      open.forEach(r => L.push(`- [${r.type} · ${r.severity}] ${r.title} — ${r.owner || 'unassigned'}`));
    }
    const decisions = p.raid.filter(r => r.type==='Decision' && daysUntil(r.date) >= -14);
    if(decisions.length){
      L.push('**Recent decisions:**');
      decisions.forEach(r => L.push(`- ${r.title} (${fmtDate(r.date)}, ${r.owner || '—'})`));
    }
    L.push('');
  });
  if(!list.length) L.push('_No active projects._');
  return L.join('\n');
}

function wouldCycle(fromId, toId){
  // fromId waits on toId → a loop if toId already (directly or indirectly) waits on fromId
  const seen = new Set(), stack = [toId];
  while(stack.length){
    const id = stack.pop(); if(id === fromId) return true;
    if(seen.has(id)) continue; seen.add(id);
    (getProject(id)?.deps || []).forEach(d => stack.push(d.on));
  }
  return false;
}

/* ============ Team sharing (shared JSON file) ============ */
// Works in Chrome and Edge: everyone opens the same JSON file in a synced folder (OneDrive, SharePoint, Google Drive for desktop, a network drive).
const share = {
  supported: 'showOpenFilePicker' in window && 'showSaveFilePicker' in window,
  handle:null, name:'', connected:false, lastModified:0, dirty:false, timer:null, busy:false,
  queueWrite(){
    if(!this.handle || !this.connected) return;
    this.dirty = true; clearTimeout(this.timer);
    this.timer = setTimeout(() => this.write(), 700);
  },
  async write(){
    if(!this.handle || !this.connected || this.busy) return;
    this.busy = true;
    try{
      const f = await this.handle.getFile();
      if(this.lastModified && f.lastModified > this.lastModified){
        let theirs = null; try{ theirs = JSON.parse(await f.text()); }catch(e){}
        const who = theirs?.meta?.savedBy ? ` by ${theirs.meta.savedBy}` : '';
        if(confirm(`Someone else saved the shared file${who} since you last loaded it.\n\nOK = load their version (your latest change is discarded)\nCancel = keep your version and save over theirs`)){
          this.busy = false; this.dirty = false; await this.read(true); return;
        }
      }
      const w = await this.handle.createWritable();
      await w.write(JSON.stringify(state, null, 2)); await w.close();
      this.lastModified = (await this.handle.getFile()).lastModified;
      this.dirty = false;
    }catch(e){
      this.connected = false; toast('Could not save to the shared file. Reconnect it from Team sharing.');
    }
    this.busy = false; renderChrome();
  },
  async read(announce){
    const f = await this.handle.getFile();
    const s = JSON.parse(await f.text());
    if(!s || !Array.isArray(s.projects)) throw new Error('not a hub file');
    state = normalize(s); this.lastModified = f.lastModified;
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    if(ui.openId && !getProject(ui.openId)) closePanel(); else if(ui.openId) renderPanel();
    render();
    if(announce) toast(`Loaded latest shared data${state.meta?.savedBy ? ` (saved by ${state.meta.savedBy})` : ''}`);
  },
  async poll(){
    if(!this.handle || !this.connected || this.busy || this.dirty || $('#dlg').open) return;
    try{
      const f = await this.handle.getFile();
      if(f.lastModified > this.lastModified) await this.read(true);
    }catch(e){}
  },
  async perm(){
    const opts = {mode:'readwrite'};
    if(await this.handle.queryPermission(opts) === 'granted') return true;
    return (await this.handle.requestPermission(opts)) === 'granted';
  },
  async remember(){ try{ await idb('put', this.handle); }catch(e){} },
  async forget(){ try{ await idb('delete'); }catch(e){} }
};
const FILE_TYPES = [{description:'PMO Hub data', accept:{'application/json':['.json']}}];
function idb(op, val){
  return new Promise((res, rej) => {
    const req = indexedDB.open('pmo-hub', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onerror = () => rej(req.error);
    req.onsuccess = () => {
      const tx = req.result.transaction('kv', op === 'get' ? 'readonly' : 'readwrite'), st = tx.objectStore('kv');
      const r = op === 'get' ? st.get('shareHandle') : op === 'put' ? st.put(val, 'shareHandle') : st.delete('shareHandle');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    };
  });
}
function shareDialog(){
  const status = !share.supported
    ? `<div class="check warn"><b>Not available in this browser</b>Team sharing needs Chrome or Microsoft Edge on a computer. You can still use Export and Import to pass a file around.</div>`
    : share.handle && share.connected
      ? `<div class="check ok"><b>Connected to ${esc(share.name)}</b>Your changes save to this file automatically, and changes others make load in within about 20 seconds.</div>`
      : share.handle
        ? `<div class="check warn"><b>${esc(share.name)} needs reconnecting</b>Your browser asks for permission again each session.</div>`
        : '';
  openDialog({
    title: 'Team sharing', okLabel: null, cancelLabel: 'Close',
    body: `${status}
      <p class="small" style="margin-top:0">There's no server behind this app, so the team shares one data file. Save it in a folder everyone can reach and that syncs: OneDrive, SharePoint, Google Drive for desktop, or a network drive. Everyone opens that same file here. Changes save to it automatically, and the Activity log records who changed what.</p>
      <div class="list" style="margin-bottom:8px">
        ${share.handle && !share.connected ? `<button class="btn primary" data-action="share-reconnect">Reconnect ${esc(share.name)}</button>` : ''}
        <button class="btn ${share.handle ? '' : 'primary'}" data-action="share-create" ${share.supported ? '' : 'disabled'}>Create a shared file from my current data</button>
        <button class="btn" data-action="share-open" ${share.supported ? '' : 'disabled'}>Open an existing shared file</button>
        ${share.handle ? `<button class="btn danger" data-action="share-disconnect">Disconnect (keep working in this browser only)</button>` : ''}
      </div>
      <p class="muted small">If two people save at the same moment, the app warns you and asks whose version to keep. For a team larger than a handful of people, a real database is the next step (see the roadmap).</p>
      ${currentUser() ? '' : `<div class="gaps"><strong>Set your name first</strong> so the activity log shows who made each change. <button class="linkish" data-action="set-user">Set it now</button></div>`}`
  });
}

/* ============ Actions ============ */
function commit(){ save(); if(ui.openId) renderPanel(); render(); }

const actions = {
  view: el => { ui.view = el.dataset.view; render(); window.scrollTo(0,0); },
  open: el => { if($('#dlg').open) closeDialog(true); openPanel(el.dataset.id); },
  close: () => closePanel(),
  ptab: el => { ui.panelTab = el.dataset.tab; renderPanel(); },
  'dlg-cancel': () => closeDialog(true),
  'set-user': () => {
    const n = prompt('Your name (used for approvals, overrides and the activity log):', currentUser());
    if(n === null) return;
    try{ localStorage.setItem(USER_KEY, n.trim()); }catch(e){}
    if($('#dlg').open) closeDialog(false);
    render(); toast(n.trim() ? `Changes will be recorded as ${n.trim()}` : 'Name cleared');
  },
  'new-project': () => {
    const p = blankProject({});
    state.projects.push(p); logAudit('Project created', 'Created directly (not through intake)', p.id);
    save(); render(); openPanel(p.id);
  },
  'del-project': () => {
    const p = getProject(ui.openId);
    if(p && confirm(`Delete "${p.name}"? This can't be undone.`)){
      const waiting = state.projects.filter(x => x.deps.some(d => d.on === p.id));
      waiting.forEach(x => { x.deps = x.deps.filter(d => d.on !== p.id); });
      state.projects = state.projects.filter(x => x.id !== p.id);
      logAudit('Project deleted', `${p.name}${waiting.length ? `. Removed dependencies from: ${waiting.map(x => x.name).join(', ')}` : ''}`, null, p.name);
      save(); closePanel();
    }
  },
  'edit-override': () => { const p = getProject(ui.openId); overrideDialog(p, p.healthOverride, () => {}); },
  'add-task': () => {
    const title = $('#newTask').value.trim(); if(!title) return $('#newTask').focus();
    const t = {id:uid(), title, owner:$('#newTaskOwner').value.trim(), due:$('#newTaskDue').value, done:false};
    getProject(ui.openId).tasks.push(t);
    logAudit('Task added', `${title}${t.owner ? ` (${t.owner})` : ''}${t.due ? `, due ${fmtDate(t.due)}` : ''}`, ui.openId);
    commit(); $('#newTask')?.focus();
  },
  'del-task': el => {
    const p = getProject(ui.openId), t = p.tasks.find(x => x.id === el.dataset.id);
    p.tasks = p.tasks.filter(x => x.id !== el.dataset.id); logAudit('Task deleted', t?.title || '', p.id); commit();
  },
  'add-raid': () => {
    const title = $('#raidTitle').value.trim(); if(!title) return $('#raidTitle').focus();
    const type = $('#raidType').value, severity = $('#raidSev').value;
    getProject(ui.openId).raid.push({id:uid(), type, title, owner:$('#raidOwner').value.trim(), severity, status: CLOSED_ON_ADD.includes(type) ? 'Closed' : 'Open', date:todayISO()});
    logAudit('Log item added', `${type} (${severity}): ${title}`, ui.openId);
    commit();
  },
  'toggle-raid': el => {
    const r = getProject(ui.openId).raid.find(x => x.id === el.dataset.id);
    r.status = r.status==='Open' ? 'Closed' : 'Open';
    logAudit(r.status === 'Closed' ? 'Log item closed' : 'Log item reopened', `${r.type}: ${r.title}`, ui.openId); commit();
  },
  'del-raid': el => {
    const p = getProject(ui.openId), r = p.raid.find(x => x.id === el.dataset.id);
    p.raid = p.raid.filter(x => x.id !== el.dataset.id); logAudit('Log item deleted', r ? `${r.type}: ${r.title}` : '', p.id); commit();
  },
  'raid-filter': el => { ui.raidFilter = el.dataset.f; renderPanel(); },
  'add-dep': () => {
    const p = getProject(ui.openId), on = $('#depOn').value, u = getProject(on); if(!u) return;
    if(wouldCycle(p.id, on)) return toast('That would create a loop');
    const d = {id:uid(), on, neededBy:$('#depNeed').value, note:$('#depNote').value.trim()};
    p.deps.push(d);
    logAudit('Dependency added', `Waits on "${u.name}"${d.neededBy ? `, needed by ${fmtDate(d.neededBy)}` : ''}${d.note ? `: ${d.note}` : ''}`, p.id);
    commit();
  },
  'del-dep': el => {
    const p = getProject(ui.openId), d = p.deps.find(x => x.id === el.dataset.id), u = d && getProject(d.on);
    p.deps = p.deps.filter(x => x.id !== el.dataset.id);
    logAudit('Dependency removed', `No longer waits on "${u ? u.name : 'deleted project'}"`, p.id); commit();
  },
  'add-update': () => {
    const text = $('#newUpdate').value.trim(); if(!text) return $('#newUpdate').focus();
    getProject(ui.openId).updates.push({id:uid(), date:todayISO(), text, by:currentUser()});
    logAudit('Status update added', text, ui.openId); commit();
  },
  'del-update': el => {
    const p = getProject(ui.openId), u = p.updates.find(x => x.id === el.dataset.id);
    p.updates = p.updates.filter(x => x.id !== el.dataset.id); logAudit('Status update deleted', u?.text || '', p.id); commit();
  },
  'add-intake': () => {
    const title = $('#in_title').value.trim(); if(!title) return $('#in_title').focus();
    const n = id => Number($('#in_'+id).value);
    const r = {id:uid(), title, requester:$('#in_requester').value.trim(), notes:$('#in_notes').value.trim(),
      value:n('value'), urgency:n('urgency'), alignment:n('alignment'), effort:n('effort'), estFte:num($('#in_fte').value), estCost:num($('#in_cost').value), status:'New', created:todayISO()};
    state.intake.push(r);
    logAudit('Request submitted', `${title} (score ${intakeScore(r)})${r.requester ? `, from ${r.requester}` : ''}`, null, title);
    save(); render(); toast('Request submitted');
  },
  approve: el => approveDialog(state.intake.find(x => x.id === el.dataset.id)),
  decline: el => declineDialog(state.intake.find(x => x.id === el.dataset.id)),
  'del-intake': el => {
    const r = state.intake.find(x => x.id === el.dataset.id);
    if(!confirm(`Delete the request "${r.title}"?`)) return;
    state.intake = state.intake.filter(x => x.id !== el.dataset.id);
    logAudit('Request deleted', r.title, null, r.title); save(); render();
  },
  'copy-report': async () => {
    const text = $('#reportText').value;
    try{ await navigator.clipboard.writeText(text); toast('Report copied'); }
    catch(e){ $('#reportText').select(); document.execCommand('copy'); toast('Report copied'); }
  },
  'download-report': () => download(`status-report-${weekEnding()}.md`, $('#reportText').value, 'text/markdown'),
  'act-more': () => { ui.actLimit += 300; renderActivity(); },
  'export-audit': () => {
    const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
    const rows = [['When','Who','Project','Action','Details'], ...filteredAudit().map(a => [new Date(a.ts).toLocaleString(), a.user, a.project, a.action, a.detail])];
    download(`pmo-hub-activity-${todayISO()}.csv`, rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
  },
  export: () => download(`pmo-hub-backup-${todayISO()}.json`, JSON.stringify(state, null, 2), 'application/json'),
  import: () => $('#importFile').click(),
  reset: () => {
    if(confirm('Replace everything with the sample data?' + (share.connected ? '\n\nThis also overwrites the shared file for everyone.' : ''))){
      state = sampleData(); save(); if(ui.openId) closePanel(); render(); toast('Sample data restored');
    }
  },
  share: () => shareDialog(),
  'share-create': async () => {
    try{
      share.handle = await showSaveFilePicker({suggestedName:'pmo-hub-shared.json', types:FILE_TYPES});
      share.name = share.handle.name; share.connected = true; share.lastModified = 0;
      await share.write(); await share.remember();
      logAudit('Team sharing', `Created shared file ${share.name}`); save();
      closeDialog(false); render(); toast(`Saving to ${share.name}`);
    }catch(e){ if(e.name !== 'AbortError') toast('Could not create the shared file'); }
  },
  'share-open': async () => {
    try{
      const [h] = await showOpenFilePicker({types:FILE_TYPES});
      share.handle = h; share.name = h.name;
      if(!(await share.perm())) throw new Error('permission');
      share.connected = true; share.dirty = false;
      await share.read(false); await share.remember();
      closeDialog(false); render(); toast(`Connected to ${share.name}`);
    }catch(e){
      if(e.name !== 'AbortError'){ share.connected = false; toast("That file couldn't be opened as PMO Hub data"); }
    }
  },
  'share-reconnect': async () => {
    try{
      if(!(await share.perm())) return toast('Permission was not granted');
      share.connected = true; share.dirty = false;
      await share.read(true); closeDialog(false); render();
    }catch(e){ share.connected = false; toast('Could not open the shared file. It may have moved.'); }
  },
  'share-disconnect': async () => {
    share.handle = null; share.name = ''; share.connected = false; await share.forget();
    closeDialog(false); render(); toast('Disconnected. Working in this browser only.');
  }
};

function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============ Events ============ */
document.addEventListener('click', e => {
  if(e.target.id === 'overlay') return closePanel();
  const el = e.target.closest('[data-action]');
  if(!el || el.dataset.action === 'toggle-task') return;
  const fn = actions[el.dataset.action]; if(fn) fn(el);
});
document.addEventListener('keydown', e => {
  if($('#dlg').open) return;
  if(e.key === 'Escape' && ui.openId) closePanel();
  if(e.key === 'Enter' && e.target.matches('.card')) openPanel(e.target.dataset.id);
  if(e.key === 'Enter' && e.target.matches('#newTask,#newTaskOwner')) actions['add-task']();
  if(e.key === 'Enter' && e.target.matches('#raidTitle,#raidOwner')) actions['add-raid']();
});
// Remember a field's value before editing so the audit trail can show old → new.
function snapField(e){
  const t = e.target; if(!t.dataset || !t.dataset.field || !ui.openId) return;
  const f = t.dataset.field; if(!(f in ui.snap)) ui.snap[f] = getPath(getProject(ui.openId), f);
}
document.addEventListener('focusin', snapField);
document.addEventListener('pointerdown', snapField);
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.action === 'toggle-task'){
    const task = getProject(ui.openId).tasks.find(x => x.id === t.dataset.id); task.done = t.checked;
    logAudit(t.checked ? 'Task completed' : 'Task reopened', task.title, ui.openId); commit(); return;
  }
  if(t.dataset.field === 'healthOverride'){
    const p = getProject(ui.openId), level = t.value, prev = p.healthOverride;
    if(!level){
      if(prev){
        logAudit('Health override removed', `Manual ${HEALTH_LABEL[prev]} removed; back to calculated ${HEALTH_LABEL[healthInfo(p).level]}`, p.id);
        p.healthOverride = ''; p.overrideReason = ''; p.overrideBy = ''; p.overrideDate = ''; commit();
      }
    } else {
      overrideDialog(p, level, () => { t.value = prev; });
    }
    delete ui.snap.healthOverride; return;
  }
  if(t.dataset.field && ui.openId){
    const f = t.dataset.field, p = getProject(ui.openId);
    const oldV = ui.snap[f], newV = getPath(p, f);
    if(f in ui.snap && String(oldV ?? '') !== String(newV ?? '')){
      logAudit('Field changed', `${FIELD_LABELS[f] || f}: ${fmtVal(f, oldV)} → ${fmtVal(f, newV)}`, p.id); save();
      if(ui.panelTab === 'overview') $('#panelTabs button:last-child').textContent = `History (${state.audit.filter(a => a.projectId === p.id).length})`;
    }
    delete ui.snap[f]; return;
  }
  if(t.dataset.setting){
    const k = t.dataset.setting, oldV = S()[k], v = num(t.value);
    if(v !== oldV){ S()[k] = v; logAudit('Settings changed', `${t.closest('.field').querySelector('label').textContent}: ${oldV} → ${v}`); save(); render(); }
    return;
  }
  if(t.id === 'healthFilter'){ ui.health = t.value; renderPortfolio(); }
  if(t.id === 'sortBy'){ ui.sort = t.value; renderPortfolio(); }
  if(t.id === 'reportScope'){ ui.reportScope = t.value; renderReport(); }
  if(t.id === 'actProject'){ ui.actProject = t.value; ui.actLimit = 150; renderActivity(); }
  if(t.id === 'actUser'){ ui.actUser = t.value; ui.actLimit = 150; renderActivity(); }
  if(t.id === 'importFile' && t.files[0]){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const s = JSON.parse(reader.result); if(!Array.isArray(s.projects)) throw 0;
        state = normalize(s); logAudit('Data imported', `Imported ${plural(state.projects.length,'project')} from a backup file`); save(); render(); toast('Data imported');
      }
      catch(err){ alert('That file is not a PMO Hub backup.'); }
      t.value = '';
    };
    reader.readAsText(t.files[0]);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.closest('#dlg')){ dlgCfg?.onInput?.(); return; }
  if(t.id === 'search'){ ui.search = t.value; const pos = t.selectionStart; renderPortfolio(); const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos); return; }
  if(t.id === 'actSearch'){ ui.actSearch = t.value; ui.actLimit = 150; $('#actList').innerHTML = auditList(filteredAudit().slice(0, ui.actLimit)); return; }
  const field = t.dataset.field; if(!field || !ui.openId || field === 'healthOverride') return;
  const p = getProject(ui.openId);
  if(!(field in ui.snap)) ui.snap[field] = getPath(p, field);
  setPath(p, field, (t.type === 'number' || t.type === 'range') ? num(t.value) : t.value);
  if(field === 'percent') $('#pctLabel').textContent = t.value + '%';
  save(); renderPanelHead(); if(ui.view !== 'report' && ui.view !== 'activity') render();
});
window.addEventListener('focus', () => share.poll());
setInterval(() => share.poll(), 20000);

// Restore a previously connected shared file (permission is re-asked on first click).
(async () => {
  if(!share.supported) return;
  try{
    const h = await idb('get');
    if(h){
      share.handle = h; share.name = h.name;
      if(await h.queryPermission({mode:'readwrite'}) === 'granted'){ share.connected = true; await share.read(false); }
      renderChrome();
    }
  }catch(e){}
})();

render();
</script>
